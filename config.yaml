pipeline:
  mode: "solo"    # solo | debate
  language: "sl"    # "sl" | "en"

  # Najdaljši posnetek, ki ga sistem sprejme
  max_recording_minutes: 23

transcription:
  model: "gpt-4o-transcribe-diarize"
  output_format: "diarized_json"

fact_checking:
  claim_decomposition: true
  parallel_workers: 5

  # Zgornja meja virov na trditev
  max_sources_per_claim: 10

  # Modeli za pod-korake preverjanja dejstev
  claim_extraction_model: "gpt-5.6-luna"
  decompose_model:        "gpt-4.1-nano"

  # Usmerjanje zbiralcev
  engine_routing: true

  # Razsojevalni korak
  judge_provider: "anthropic"    # openai | anthropic | grok
  judge_model:    "claude-sonnet-5"

  # Proračun izhoda razsodnika
  judge_max_tokens:      4096
  judge_max_tokens_cap:  16384
  judge_max_attempts:    3

  engines:
    web_search: true
    pubmed: true
    semantic_scholar: true
    openalex: true
    crossref: true
    wikidata: true
    google_factcheck: true
    perplexity: true
    grok: true

  grok_model: "grok-4.3"
  grok_reasoning_effort: "low"    # none | low | medium | high

  cache:
    # Med meritvami mora biti false.
    enabled: false
    directory: ".cache/fact_check"
    ttl_hours: 168

analysis:
  provider: "anthropic"    # openai | anthropic
  model: "claude-sonnet-5"
  temperature: 0.1

  # Stopnjevani modeli
  pass_models:
    claim_extraction:    "claude-sonnet-5"
    argument_structure:  "claude-sonnet-5"
    rebuttal_mapping:    "claude-haiku-4-5-20251001"

  # Najmanjše število premis na argument
  min_premises_per_argument: 2

  # Prompt caching (Anthropic)
  prompt_caching: true

  # Transkript budget za analizo
  transcript_token_budget_chars: 80000

  # Per-pass max output tokenov
  pass_max_tokens:
    claim_extraction:   8192
    argument_structure: 8192
    rebuttal_mapping:   4096
    synthesis:          12288

  default_max_tokens: 12288

  max_output_tokens_cap: 24576

retry:
  max_attempts: 3
